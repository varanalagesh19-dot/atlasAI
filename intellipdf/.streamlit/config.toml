[theme]
base = "light"
primaryColor = "#1e3a8a"
backgroundColor = "#f6f8fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
font = "sans serif"

[server]
headless = true
# Streamlit Community Cloud allows 200 MB by default; subject PDFs are
# usually small, so keep the ceiling modest and aligned with MAX_UPLOAD_MB.
maxUploadSize = 50
fileWatcherType = "auto"

[browser]
gatherUsageStats = false